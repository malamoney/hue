[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hue-grpc"
description = "Exposes a subset of the Philips Hue CLIP v2 API over gRPC."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]

# Deliberately no zeroconf: mDNS discovery is out of scope, the bridge
# address is static configuration. See docs/adr/ and the project CONTEXT.md.
dependencies = [
  "grpcio",
  "grpcio-health-checking",
  "grpcio-reflection",
  "protobuf",
  "httpx",
]

[project.scripts]
hue-grpc-server = "hue_grpc.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hue_grpc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Philips' root CA. The Bridge never serves it, so it has to ship with the
# package or no connection can be verified at all.
[tool.setuptools.package-data]
"hue_grpc.hue" = ["*.pem"]

[tool.pytest.ini_options]
# Only the runtime package's tests. The generator under tools/ is build
# tooling with its own dependencies and its own flake check.
# tests/smoke needs a real Bridge on the network and is run by hand.
testpaths = ["tests/unit"]
# No pythonpath entry on purpose: under Nix the check phase must exercise the
# installed package, not the source tree. The dev shell exports PYTHONPATH.

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# Generated by protoc during the build and on dev shell entry. There is
# nothing to fix in it that would survive the next regeneration.
extend-exclude = ["src/hue"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# `hue` is generated into src/ by the build, so whether it is on disk when
# lint runs depends on where lint runs — and ruff would otherwise call it
# first-party here and third-party in CI, sorting the same file two ways.
known-first-party = ["hue", "hue_grpc"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
mypy_path = "src:tools"
# Generated protobuf code, which only exists once codegen has run. Checking
# protoc's output says nothing about this project, and it is not ours to fix.
exclude = "^src/hue/"

# PyYAML ships no type information.
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

# grpcio ships no type information either, and neither typeshed's stubs nor
# grpc-stubs are packaged in nixpkgs, so there is nothing to depend on.
[[tool.mypy.overrides]]
module = [
  "grpc",
  "grpc.*",
  "grpc_health.*",
  "grpc_reflection.*",
]
ignore_missing_imports = true

# protobuf ships .pyi files but is not marked as typed, and neither it nor
# types-protobuf is something to depend on here for the same reason as grpcio.
[[tool.mypy.overrides]]
module = ["google.protobuf.*"]
ignore_missing_imports = true

# The generated modules, as seen from the code that imports them. Nothing is
# gained by following them: their .pyi files describe messages in terms of a
# protobuf runtime that is itself untyped here, and their gRPC halves are
# generated without annotations at all.
[[tool.mypy.overrides]]
module = ["hue.*"]
follow_imports = "skip"
ignore_missing_imports = true

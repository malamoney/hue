name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    # x86_64-linux, which is what the deployment target runs and what no
    # local machine can build for: the dev Mac is aarch64-darwin and the
    # Nix container is aarch64-linux.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --all-systems evaluates the darwin outputs too. Without it a darwin
      # eval error would sit undetected until someone opened the dev shell
      # on the Mac.
      - name: Flake checks (package build, pytest, ruff, mypy)
        run: nix flake check --all-systems --print-build-logs

      - name: Build the package
        run: nix build --print-build-logs

      - name: Packaged binary runs
        run: ./result/bin/hue-grpc-server --version
